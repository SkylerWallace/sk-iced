name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "16777216"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets --locked -- -D warnings
      - run: cargo doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked --features x11
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo test --all-features --all-targets --locked
      - run: cargo test --all-features --doc --locked
      - run: cargo run --features components --example quick_start --locked
  features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags:
          - --no-default-features
          - --no-default-features --features serde
          - --no-default-features --features theme,x11
          - --no-default-features --features animations,x11
          - --no-default-features --features components,x11
          - --no-default-features --features icons,x11
          - --no-default-features --features svg,x11
          - --all-features
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --lib --locked ${{ matrix.flags }}
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --lib --all-features --locked
